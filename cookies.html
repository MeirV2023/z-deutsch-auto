<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOCANOVA — Cookie &amp; Local Storage Policy (EU ePrivacy / TDDDG)</title>
  <link rel="icon" type="image/svg+xml" href="image/favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050a18;
      --card: rgba(12, 22, 46, 0.88);
      --border: rgba(112, 168, 255, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --emerald: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.14), transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 24px 16px 56px;
    }
    .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--border);
    }
    .back-link { color: var(--cyan); font-weight: 700; text-decoration: none; font-size: 0.92rem; }
    .back-link:hover { text-decoration: underline; }
    .nav-links { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 0.86rem; }
    .nav-links a { color: #cbd5e1; text-decoration: none; }
    .nav-links a.active { color: var(--emerald); font-weight: 700; }
    .nav-links a:hover { color: var(--cyan); }
    .lang-switch { display: inline-flex; gap: 6px; }
    .lang-btn {
      border: 1px solid var(--border); background: rgba(15, 29, 60, 0.8); color: #cbd5e1;
      border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
    }
    .lang-btn.active { border-color: var(--emerald); background: rgba(16, 185, 129, 0.2); color: #ecfdf5; }
    .hero, .card {
      padding: 24px 26px; border-radius: 18px; background: var(--card); border: 1px solid var(--border);
    }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.74rem;
      font-weight: 800; letter-spacing: 0.04em; color: #7dd3fc;
      background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.35);
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2rem); color: #fff; }
    h2 { margin: 0 0 10px; font-size: 1.15rem; color: #7dd3fc; }
    p { margin: 0 0 10px; color: #cbd5e1; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid rgba(112, 168, 255, 0.14); vertical-align: top; }
    th { background: rgba(14, 165, 233, 0.1); color: #7dd3fc; font-size: 0.78rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    code { color: #6ee7b7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.84em; }
    .reset-btn {
      margin-top: 8px; padding: 9px 15px; border-radius: 10px; cursor: pointer; font-weight: 700;
      border: 1px solid rgba(52, 211, 153, 0.5); background: rgba(16, 185, 129, 0.18); color: #ecfdf5;
    }
    .reset-msg { margin-top: 8px; font-size: 0.85rem; color: var(--emerald); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topbar">
      <a class="back-link" href="index.html" id="backLink">← Вернуться в VOCANOVA</a>
      <div class="nav-links">
        <a href="privacy.html" id="navPrivacy">Конфиденциальность</a>
        <a href="cookies.html" class="active" id="navCookies">Cookies</a>
        <a href="terms.html" id="navTerms">Условия и Impressum</a>
      </div>
      <div class="lang-switch">
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </div>
    </nav>

    <main id="contentRoot"></main>
  </div>

  <script>
    const ROWS = [
      { key: 'zdeutsch_save_v2', cat: { ru: 'Необходимое', en: 'Essential', de: 'Notwendig' }, desc: { ru: 'Языки интерфейса/обучения, активный курс, скорость, оружие и рекорд', en: 'Language pair, active course/lesson, speed, weapon & high score', de: 'Sprachpaar, aktiver Kurs, Geschwindigkeit, Waffe & Highscore' }, exp: 'Persistent' },
      { key: 'zlingo_fsrs_cards_v1', cat: { ru: 'Необходимое', en: 'Essential', de: 'Notwendig' }, desc: { ru: 'Кривая памяти FSRS-5 по каждому слову (D, S, повторы, дата следующего показа)', en: 'Per-word FSRS-5 memory curve (D, S, reps & next review date)', de: 'FSRS-5-Gedächtniskurve je Wort (D, S, Wiederholungen & Fälligkeit)' }, exp: 'Persistent' },
      { key: 'zlingo_learned_words_v1', cat: { ru: 'Необходимое', en: 'Essential', de: 'Notwendig' }, desc: { ru: 'Список выученных слов для прогресса курсов и разблокировки оружия', en: 'Learned vocabulary IDs used for progress & arsenal unlocks', de: 'Gelernte Wörter für Kursfortschritt & Waffenfreischaltung' }, exp: 'Persistent' },
      { key: 'zlingo_pinned_words_v1 / fav / daily / recent', cat: { ru: 'Необходимое', en: 'Essential', de: 'Notwendig' }, desc: { ru: 'Закладки ⭐, избранные колоды, дневная цель, серия дней и история колод', en: '⭐ Bookmarks, favorite decks, daily goal, streak & recent decks', de: '⭐ Lesezeichen, Favoriten-Decks, Tagesziel, Streak & Verlauf' }, exp: 'Persistent' },
      { key: 'zlingo_cookie_consent_v1', cat: { ru: 'Необходимое', en: 'Essential', de: 'Notwendig' }, desc: { ru: 'Запоминает ваш выбор в баннере согласия cookies и не показывает его повторно', en: 'Stores your consent choice so the banner stays dismissed', de: 'Speichert deine Auswahl im Datenschutzbanner' }, exp: 'Persistent' },
      { key: 'IndexedDB (zlingo_anki_db)', cat: { ru: 'Необходимое', en: 'Essential', de: 'Notwendig' }, desc: { ru: 'Локально загруженные колоды Anki (.apkg / .colpkg / .tsv)', en: 'Locally imported Anki decks (.apkg / .colpkg / .tsv)', de: 'Lokal importierte Anki-Decks (.apkg / .colpkg / .tsv)' }, exp: 'Persistent' },
      { key: 'zdeutsch_gemini_api_key', cat: { ru: 'Функциональное', en: 'Functional', de: 'Funktional' }, desc: { ru: 'Опциональный личный ключ Gemini TTS API (если добавлен вами вручную)', en: 'Optional user-supplied Gemini API key for TTS audio', de: 'Optionaler eigener Gemini-API-Key für TTS (falls eingetragen)' }, exp: 'User-controlled' },
      { key: 'zlingo_auth_profile_v1 + vocanova_session (HttpOnly Cookie)', cat: { ru: 'Необходимое (при входе)', en: 'Essential (if signed in)', de: 'Notwendig (bei Login)' }, desc: { ru: 'Только при добровольном входе через Google: сессионная cookie авторизации и имя/аватар для синхронизации облака', en: 'Set only upon voluntary Google Sign-In: HttpOnly session token and cached profile for cloud sync', de: 'Nur nach freiwilligem Google-Login: HttpOnly-Session-Cookie und Profil für Cloud-Sync' }, exp: '30 days / Logout' }
    ];

    const DOCS = {
      ru: {
        title: 'VOCANOVA — Политика Cookies и локального хранилища',
        back: '← Вернуться в VOCANOVA',
        nav: ['Конфиденциальность', 'Cookies', 'Условия и Impressum'],
        badge: 'EU ePRIVACY · § 25 TDDDG',
        h1: 'Политика Cookies и браузерного хранилища',
        intro: 'Согласно Директиве ЕС ePrivacy (ст. 5(3)) и § 25 TDDDG мы открыто раскрываем все технологии хранения данных на вашем устройстве. VOCANOVA НЕ устанавливает рекламные или отслеживающие сторонние cookies — вместо серверной слежки игра использует локальное хранилище браузера (localStorage и IndexedDB).',
        tableTitle: 'Полный реестр ключей хранения',
        cols: ['Ключ / Хранилище', 'Категория', 'Назначение', 'Срок'],
        noTrackTitle: 'Рекламные и аналитические cookies: 0',
        noTrackText: 'На сайте не используются Google Analytics, Meta Pixel или рекламные трекеры. Согласие требуется только для опциональной функциональности — базовое сохранение уроков, колод Anki и FSRS-5 относится к технически необходимым данным по вашему прямому запросу сервиса.',
        manageTitle: 'Управление и сброс выбора',
        resetBtn: '🔄 Сбросить решение по cookies',
        resetDone: '✓ Согласие сброшено — при переходе на главную баннер появится снова.'
      },
      en: {
        title: 'VOCANOVA — Cookie & Browser Storage Policy',
        back: '← Back to VOCANOVA',
        nav: ['Privacy Policy', 'Cookie Policy', 'Terms & Impressum'],
        badge: 'EU ePRIVACY · § 25 TDDDG',
        h1: 'Cookie & Local Storage Policy',
        intro: 'Under EU ePrivacy Directive Art. 5(3) and German § 25 TDDDG, websites must disclose device storage access. VOCANOVA sets ZERO third-party advertising or cross-site tracking cookies and relies strictly on browser localStorage and IndexedDB so your learning stays on your device.',
        tableTitle: 'Inventory of Client-Side Storage Keys',
        cols: ['Key / Store', 'Category', 'Purpose', 'Retention'],
        noTrackTitle: 'Advertising & Tracking Cookies: None',
        noTrackText: 'No third-party ad networks, analytics pixels, or behavioral profiling scripts run on VOCANOVA. Essential storage keys are strictly required to deliver the requested learning game, FSRS-5 scheduling, and offline Anki deck storage.',
        manageTitle: 'Reset Your Consent Choice',
        resetBtn: '🔄 Reset Cookie Consent Choice',
        resetDone: '✓ Consent cleared — the banner will prompt again on the main page.'
      },
      de: {
        title: 'VOCANOVA — Cookie- & Browser-Speicher-Richtlinie',
        back: '← Zurück zu VOCANOVA',
        nav: ['Datenschutz', 'Cookies', 'Nutzung & Impressum'],
        badge: 'EU ePRIVACY · § 25 TDDDG',
        h1: 'Cookie- & Local-Storage-Richtlinie',
        intro: 'Gemäß § 25 TDDDG und Art. 5 Abs. 3 ePrivacy-Richtlinie informieren wir transparent über sämtliche Speicherzugriffe auf deinem Endgerät. VOCANOVA setzt KEINE Werbe- oder Tracking-Cookies von Drittanbietern ein, sondern speichert Lernstände lokal via localStorage und IndexedDB.',
        tableTitle: 'Übersicht aller Speicher-Schlüssel',
        cols: ['Schlüssel / Speicher', 'Kategorie', 'Zweck', 'Dauer'],
        noTrackTitle: 'Werbe- & Analyse-Cookies: Keine (0)',
        noTrackText: 'Es sind keine Werbenetzwerke oder Tracking-Skripte eingebunden. Unbedingt erforderliche Schlüssel werden benötigt, um das von dir gestartete Lernspiel, FSRS-5 sowie importierte Anki-Decks lokal bereitzustellen.',
        manageTitle: 'Einwilligung zurücksetzen',
        resetBtn: '🔄 Cookie-Auswahl zurücksetzen',
        resetDone: '✓ Einwilligung gelöscht – beim Öffnen der Hauptseite erscheint der Hinweis erneut.'
      }
    };

    function detectLang() {
      try {
        const saved = JSON.parse(localStorage.getItem('zdeutsch_save_v2') || '{}');
        if (saved.nativeLang && DOCS[saved.nativeLang]) return saved.nativeLang;
      } catch (_) {}
      const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return DOCS[nav] ? nav : 'en';
    }

    function renderDoc(lang) {
      const d = DOCS[lang] || DOCS.en;
      document.documentElement.lang = lang;
      document.title = d.title;
      document.getElementById('backLink').textContent = d.back;
      document.getElementById('navPrivacy').textContent = d.nav[0];
      document.getElementById('navCookies').textContent = d.nav[1];
      document.getElementById('navTerms').textContent = d.nav[2];
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

      const rowsHtml = ROWS.map(r => `
        <tr>
          <td><code>${r.key}</code></td>
          <td>${r.cat[lang] || r.cat.en}</td>
          <td>${r.desc[lang] || r.desc.en}</td>
          <td>${r.exp}</td>
        </tr>
      `).join('');

      document.getElementById('contentRoot').innerHTML = `
        <header class="hero">
          <div class="badge">${d.badge}</div>
          <h1>${d.h1}</h1>
          <p>${d.intro}</p>
        </header>
        <section class="card">
          <h2>${d.tableTitle}</h2>
          <div class="table-wrap">
            <table>
              <thead><tr>${d.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2>${d.noTrackTitle}</h2>
          <p>${d.noTrackText}</p>
        </section>
        <section class="card">
          <h2>${d.manageTitle}</h2>
          <button type="button" class="reset-btn" id="btnResetConsent">${d.resetBtn}</button>
          <div class="reset-msg" id="resetMsg" hidden>${d.resetDone}</div>
        </section>
      `;

      document.getElementById('btnResetConsent').addEventListener('click', () => {
        try { localStorage.removeItem('zlingo_cookie_consent_v1'); } catch (_) {}
        document.getElementById('resetMsg').hidden = false;
      });
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => renderDoc(btn.dataset.lang));
    });
    renderDoc(detectLang());
  </script>
</body>
</html>
